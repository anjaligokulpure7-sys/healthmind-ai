# ══════════════════════════════════════════════
# HEALTHMIND USER SERVICE — Common Configuration
# These settings apply to ALL environments
# ══════════════════════════════════════════════

spring:
  application:
    name: user-service

# Active profile — change this to switch environment
# Options: dev, prod

  profile:
    active: dev

# JPA common settings

  jpa:
    open-in-view: false


# Jackson common settings

  jackson:
    serilization:
      write-dates-timestamps: false
    default-property-inclusion: non_null
# Actuator — health checks and metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Eureka — same for all environments
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
